<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyberlogic API — Request Access</title>
    <link href="assets/vendors/font-awesome/css/font-awesome.min.css" rel="stylesheet" />
    <link href='https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet' type='text/css' />
    <link rel="icon" href="customAssets/img/CyberlogicIcon.svg" />
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            background: #eef1f7;
            font-family: Lato, 'Helvetica Neue', sans-serif;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        .topbar {
            background: #1C4084; border-bottom: 3px solid #EB8008;
            padding: 14px 28px; display: flex; align-items: center; gap: 14px;
        }
        .topbar img { max-width: 140px; filter: brightness(0) invert(1); }
        .topbar-badge {
            background: rgba(235,128,8,.18); color: #EB8008;
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            padding: 3px 10px; border-radius: 20px; border: 1px solid rgba(235,128,8,.35);
        }
        .wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
        .card {
            background: #fff; border-radius: 8px;
            box-shadow: 0 4px 32px rgba(28,64,132,.11);
            padding: 48px 52px 40px; width: 100%; max-width: 440px;
        }
        .card h1 { font-size: 21px; color: #1C4084; font-weight: 700; margin: 0 0 5px; }
        .card p  { font-size: 13px; color: #6c8cbf; margin: 0; }
        .divider {
            height: 3px; background: linear-gradient(to right, #EB8008, #1C4084);
            border-radius: 2px; margin: 22px 0;
        }
        .field { margin-bottom: 18px; }
        .field label {
            display: block; font-size: 11px; font-weight: 700;
            color: #1C4084; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 7px;
        }
        .field-wrap { position: relative; }
        .field-wrap .fi {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: #9db5d5; font-size: 13px; pointer-events: none;
        }
        .field input {
            width: 100%; padding: 10px 12px 10px 34px;
            border: 1px solid #ccd6e8; border-radius: 4px;
            font-size: 14px; color: #333; background: #f7f9fc;
            transition: border-color .2s, box-shadow .2s; outline: none; font-family: inherit;
        }
        .field input:focus { border-color: #1C4084; box-shadow: 0 0 0 3px rgba(28,64,132,.12); background: #fff; }
        .field input::placeholder { color: #b0bfce; }
        .domain-hint {
            font-size: 11px; color: #9db5d5; margin-top: 5px;
        }
        .domain-hint i { color: #EB8008; }
        .alert {
            display: none; border-radius: 4px; font-size: 13px; padding: 10px 14px; margin-bottom: 18px;
        }
        .alert-error {
            background: rgba(220,53,69,.07); border: 1px solid rgba(220,53,69,.22);
            border-left: 3px solid #dc3545; color: #b02a37;
        }
        .alert-success {
            background: rgba(40,167,69,.08); border: 1px solid rgba(40,167,69,.25);
            border-left: 3px solid #28a745; color: #1a5c2e;
        }
        .btn {
            width: 100%; padding: 13px; background: #1C4084; border: none;
            border-radius: 4px; color: #fff; font-size: 14px; font-weight: 700;
            letter-spacing: .5px; text-transform: uppercase; cursor: pointer;
            transition: background .15s; font-family: inherit;
        }
        .btn:hover:not(:disabled) { background: #163366; }
        .btn:disabled { opacity: .65; cursor: not-allowed; }
        .foot {
            text-align: center; font-size: 12px; color: #9db5d5; margin-top: 20px;
        }
        .foot a { color: #1C4084; text-decoration: none; }
        .foot a:hover { text-decoration: underline; }
        .page-foot {
            background: #1C4084; color: rgba(255,255,255,.4);
            text-align: center; font-size: 11px; padding: 10px;
        }
        @media (max-width: 480px) { .card { padding: 32px 20px 28px; } }
    </style>
</head>
<body>

<div class="topbar">
    <img src="customAssets/img/CyberlogicLogo.png" alt="Cyberlogic" />
    <span class="topbar-badge"><i class="fa fa-user-plus"></i>&nbsp; Request Access</span>
</div>

<div class="wrap">
    <div class="card">
        <h1>Request Admin Access</h1>
        <p>Submit your Cyberlogic email to request access to the Admin Panel.</p>
        <div class="divider"></div>

        <div class="alert alert-error" id="err"></div>
        <div class="alert alert-success" id="ok"></div>

        <div id="form-wrap">
            <div class="field">
                <label><i class="fa fa-envelope"></i>&nbsp; Email Address</label>
                <div class="field-wrap">
                    <i class="fa fa-envelope fi"></i>
                    <input type="email" id="f-email" placeholder="yourname@cyberlogic.gr" autocomplete="email" />
                </div>
                <div class="domain-hint"><i class="fa fa-info-circle"></i>&nbsp; Only <strong>@cyberlogic.gr</strong> addresses are accepted.</div>
            </div>

            <button class="btn" id="btn-register">
                <i class="fa fa-paper-plane"></i>&nbsp; Submit Request
            </button>
        </div>

        <div class="foot">
            Already have access? <a href="AdminLogin.html">Sign in &rarr;</a>
        </div>
    </div>
</div>

<div class="page-foot">&copy; Cyberlogic e-Tourism Platform &mdash; Admin</div>

<script>
    document.addEventListener('keydown', function(e) { if (e.key === 'Enter') doRegister(); });
    document.getElementById('btn-register').addEventListener('click', doRegister);

    function showErr(msg) {
        var el = document.getElementById('err');
        el.textContent = msg; el.style.display = 'block';
        document.getElementById('ok').style.display = 'none';
    }

    function showOk(msg) {
        var el = document.getElementById('ok');
        el.innerHTML = '<i class="fa fa-check-circle"></i>&nbsp; ' + msg;
        el.style.display = 'block';
        document.getElementById('err').style.display = 'none';
        document.getElementById('form-wrap').style.display = 'none';
    }

    function doRegister() {
        var email = document.getElementById('f-email').value.trim();
        var btn   = document.getElementById('btn-register');

        document.getElementById('err').style.display = 'none';

        if (!email) { showErr('Email address is required.'); return; }
        if (!/^[^@\s]+@cyberlogic\.gr$/i.test(email)) {
            showErr('Only @cyberlogic.gr email addresses are allowed.'); return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>&nbsp; Submitting&hellip;';

        fetch('api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        })
        .then(function(r) {
            if (!r.ok) return r.text().then(function(t) { throw new Error(t || 'Server error'); });
            return r.json();
        })
        .then(function() {
            showOk('Your request has been submitted. The administrator will review it and provide your temporary password.');
        })
        .catch(function(err) {
            var msg = err.message || 'Server error — please try again.';
            try { var j = JSON.parse(msg); if (j.message) msg = j.message; } catch(e) {}
            showErr(msg);
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-paper-plane"></i>&nbsp; Submit Request';
        });
    }
</script>
</body>
</html>
