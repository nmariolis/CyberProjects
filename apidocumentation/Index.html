<!DOCTYPE html>
<style>
    /* Tree connector lines for schema table */
    .varName::before {
        content: "";
        display: inline-block;
        vertical-align: middle;
        width: 10px;
        height: 1px;
        background: #ccd6e8;
    }

    .varName::after {
        content: "";
        display: inline-block;
        vertical-align: middle;
        width: 1px;
        height: 7px;
        background: #ccd6e8;
    }

    .defaultVar {
        vertical-align: middle;
        font-size: 13px;
        line-height: 20px;
    }

    r:first-of-type > .tdStyle {
        background-image: linear-gradient(transparent 0%, transparent 22px, #ccd6e8 22px, #ccd6e8 100%);
    }

    tr:first-of-type > .tdStyle, tr.last > .tdStyle {
        border-left-width: 0;
        background-size: 1px 100%;
        background-position: left top;
        background-repeat: no-repeat;
    }

    tr.last > .tdStyle {
        background-image: linear-gradient(#ccd6e8 0%, #ccd6e8 22px, transparent 22px, transparent 100%);
    }

    tr:first-of-type > .tdStyle {
        background-image: linear-gradient(transparent 0%, transparent 22px, #ccd6e8 22px, #ccd6e8 100%);
    }

    .fieldType {
        width: 75%;
        box-sizing: border-box;
        border-bottom: 1px solid #ccd6e8;
        padding: 10px 0;
    }

    .varDescription-light {
        vertical-align: middle;
        font-size: 13px;
        line-height: 20px;
        color: rgba(128, 128, 128, 0.8);
    }

    .fieldDescription code {
        color: #1C4084;
        background-color: rgba(28, 64, 132, 0.05);
        font-family: "Courier New", monospace;
        font-size: 13px;
        font-weight: 400;
        word-break: break-word;
        border-radius: 2px;
        border: 1px solid rgba(28, 64, 132, 0.1);
        padding: 0 5px;
    }

    code {
        border: 1px solid #dde3ec;
        margin: 0 2px;
        padding: 0 5px;
        font-size: 12px;
    }

    tt, code, kbd, samp {
        font-family: monospace;
    }

    /* ── Field lookup browse button ── */
    .btn-lookup {
        display: inline-block; background: none; border: 1px solid #c8d4e8; border-radius: 3px;
        padding: 1px 5px; cursor: pointer; color: #1C4084; font-size: 10px; vertical-align: middle;
        margin-left: 4px; line-height: 14px;
    }
    .btn-lookup:hover { background: #eef3fa; border-color: #1C4084; }
    .btn-lookup .fa { font-size: 10px; }

    /* ── Lookup modal overlay ── */
    #lookup-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,.45); z-index: 9999;
        display: none; align-items: center; justify-content: center;
    }
    #lookup-overlay.is-open { display: flex; }
    #lookup-modal {
        background: #fff; border-radius: 8px; width: 540px; max-width: 94vw;
        max-height: 82vh; display: flex; flex-direction: column;
        box-shadow: 0 12px 48px rgba(0,0,0,.28);
    }
    #lookup-modal-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 13px 18px; border-bottom: 1px solid #e4e8f0; flex-shrink: 0;
    }
    #lookup-modal-title { margin: 0; font-size: 13px; font-weight: 700; color: #1C4084; }
    #lookup-modal-close {
        background: none; border: none; cursor: pointer; color: #999; font-size: 20px;
        line-height: 1; padding: 0 4px;
    }
    #lookup-modal-close:hover { color: #333; }
    #lookup-modal-extras { padding: 10px 18px 4px; border-bottom: 1px solid #f0f3f8; flex-shrink: 0; }
    #lookup-modal-body { overflow-y: auto; padding: 12px 18px; flex: 1; }
    #lookup-loading { color: #888; font-size: 13px; padding: 16px 0; text-align: center; }
    #lookup-error { color: #c0392b; font-size: 12px; padding: 8px 0; }
    #lookup-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #lookup-table th { text-align: left; padding: 5px 8px; color: #1C4084; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; border-bottom: 2px solid #dde4f0; }
    #lookup-table td { padding: 5px 8px; border-bottom: 1px solid #f2f4f8; }
    #lookup-table tr:last-child td { border-bottom: none; }
    #lookup-table tr:hover td { background: #f7f9fc; }
    .btn-lookup-use {
        background: #1C4084; color: #fff; border: none; border-radius: 3px;
        padding: 3px 10px; cursor: pointer; font-size: 11px; white-space: nowrap;
    }
    .btn-lookup-use:hover { background: #2a5298; }
    .lookup-extra-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .lookup-extra-row label { font-size: 12px; font-weight: 600; white-space: nowrap; color: #444; }
    .lookup-extra-row input { height: 28px; padding: 2px 8px; font-size: 12px; border: 1px solid #c8d4e8; border-radius: 4px; width: 120px; }
    .lookup-extra-row .btn-lookup-load {
        background: #EB8008; color: #fff; border: none; border-radius: 4px;
        padding: 4px 14px; cursor: pointer; font-size: 12px;
    }
    .lookup-extra-row .btn-lookup-load:hover { background: #d4720a; }
</style>

    <!-- Scripts -->
    <script lang="javascript">
        /* ── Session guard ────────────────────────────────────────────────── */
        var CL_SESSION = (function() {
            var raw = sessionStorage.getItem('cl_session');
            if (!raw) { window.location.replace('Login.html'); return {}; }
            try { return JSON.parse(raw); }
            catch(e) { sessionStorage.removeItem('cl_session'); window.location.replace('Login.html'); return {}; }
        })();

        function clLogout() {
            sessionStorage.removeItem('cl_session');
            window.location.replace('Login.html');
        }

        /* Replace avra-hub base with the session endpoint for any service URL */
        function swapEndpoint(url) {
            if (!url || !CL_SESSION.endpoint) return url;
            return url.replace(/^https?:\/\/[a-z0-9-]+\.cyberlogic\.cloud/, CL_SESSION.endpoint);
        }

        var schemaCache = {};
        var svcLinkByHref = {};
        var FIELD_DESC = {};

        /* Load field descriptions, then service catalog (ensures FIELD_DESC is ready before schemas render) */
        $.ajax({
            url: 'models/fieldDescriptions.json',
            datatype: 'json', type: 'get', cache: false,
            success: function(data) { FIELD_DESC = data || {}; },
            complete: function() { loadServiceCatalog(); }
        });

        /* Load and render dynamic content sections (Introduction, Using Web Service, etc.) */
        $.ajax({
            url: 'models/content.json',
            datatype: 'json', type: 'get', cache: false,
            success: function(data) {
                if (!data || !data.sections || !data.sections.length) return;
                var sidebarItems = '';
                var mainHtml = '';
                $(data.sections).each(function(i, sec) {
                    sidebarItems += '<li><a href="#' + escapeAttr(sec.id) + '">' + escapeXml(sec.title) + '</a></li>';
                    mainHtml += renderContentSection(sec);
                });
                $('#sidebar-getting-started').html(
                    '<a href="#' + escapeAttr(data.sections[0].id) + '" class="has-child">Getting Started</a><ul>' + sidebarItems + '</ul>'
                );
                $('#static-sections').html(mainHtml);
            }
        });

        function renderContentSection(sec) {
            var html = '<section><div class="row"><div class="col-lg-7 col-md-12 col-sm-12 col-xs-12 leftSection">';
            html += '<h2 id="' + escapeAttr(sec.id) + '">' + escapeXml(sec.title) + '</h2>';
            $.each(sec.items || [], function(i, item) {
                if (item.type === 'code') {
                    html += '<pre><code data-language="' + escapeAttr(item.language || 'text') + '">' + escapeXml(item.text || '') + '</code></pre>';
                } else {
                    html += '<p>' + escapeXml(item.text || '') + '</p>';
                }
            });
            html += '</div></div></section>';
            return html;
        }



        function loadServiceCatalog() {
            $.ajax({
                url: 'models/webServicesUpdated.json',
                datatype: 'json',
                type: 'get',
                cache: false,
                success: function(data) {
                    var sidebarMenu = '';
                    var mainContent = '';
                    $(data.serviceCategory).each(function(i, cat) {
                        sidebarMenu += menuItemTemplate(cat);
                        mainContent += mainContentTemplate(cat.services);
                        $(cat.services).each(function(j, svc) { svcLinkByHref[svc.href] = svc.link; });
                    });
                    $('#sidebar-menu').append(sidebarMenu);
                    $('#main-content').append(mainContent);
                    loadAllSchemas(data);
                    /* Show active environment in navbar */
                    $('#nav-env-name').text(CL_SESSION.endpointName || CL_SESSION.endpoint || '');
                    $('#nav-env-item').show();
                }
            });
        }

        function menuItemTemplate(cat) {
            return '<li>' +
                '<a href="#' + cat.services[0].href + '" class="has-child">' + cat.name + '</a>' +
                subMenuItemTemplate(cat.services) +
                '</li>';
        }

        function subMenuItemTemplate(services) {
            var html = '<ul>';
            $(services).each(function(i, svc) {
                html += '<li><a href="#' + svc.href + '">' + svc.service + '</a></li>';
            });
            return html + '</ul>';
        }

        function mainContentTemplate(services) {
            var html = '';
            $(services).each(function(i, svc) {
                html +=
                    '<section>' +

                    '<div class="row">' +
                    '<div class="col-xs-12 leftSection">' +
                    '<h2 id="' + svc.href + '">' + svc.service + '</h2>' +
                    '<p>' + svc.description + '</p>' +
                    '<p class="svc-endpoint"><strong>Endpoint</strong>&nbsp; <a href="' + swapEndpoint(svc.link) + '" class="endpoint-url">' + swapEndpoint(svc.link) + '</a></p>' +
                    '</div></div>' +

                    '<div class="row">' +
                    '<div class="col-xs-12 leftSection">' +
                    '<div class="promo small-icon left"><i class="fa fa-list"></i><h3>Request Parameters</h3></div>' +
                    '<div id="schema-req-' + svc.href + '"><em class="loading-msg">Loading schema…</em></div>' +
                    '</div></div>' +

                    '<div class="row">' +
                    '<div class="col-lg-7 col-md-12 col-sm-12 col-xs-12 leftSection">' +
                    '<div class="promo small-icon left"><i class="fa fa-pencil-square-o"></i><h3>Try It</h3></div>' +
                    '<div id="form-container-' + svc.href + '" class="form-panel"><em>Loading…</em></div>' +
                    '</div>' +
                    '<div class="col-lg-5 col-md-12 col-sm-12 col-xs-12 right-panel">' +
                    '<div class="promo small-icon left rp-promo"><i class="fa fa-code"></i><h3>Request XML</h3></div>' +
                    '<pre class="codeBlock-inline xml rp-pre" id="xml-req-' + svc.href + '"><code id="xml-req-code-' + svc.href + '">Fill the form and click Generate.</code></pre>' +
                    '</div></div>' +

                    '<div class="row">' +
                    '<div class="col-xs-12 resp-wrap">' +
                    '<div class="promo small-icon left"><i class="fa fa-reply"></i><h3>Response</h3></div>' +
                    '<pre class="codeBlock-inline xml" id="xml-res-' + svc.href + '" style="min-height:160px;overflow:auto;padding:15px"><code id="xml-res-code-' + svc.href + '"></code></pre>' +
                    '</div></div>' +

                    '<div class="row">' +
                    '<div class="col-xs-12 leftSection">' +
                    '<div class="promo small-icon left"><i class="fa fa-sitemap"></i><h3>Response Schema</h3></div>' +
                    '<div id="schema-res-' + svc.href + '"><em class="loading-msg">Loading schema…</em></div>' +
                    buildXsdLinks(svc) +
                    '</div></div>' +

                    '</section>';
            });
            return html;
        }

        function buildXsdLinks(svc) {
            var html = '<div class="xsd-links">';
            if (svc.xsdRequest) {
                html += '<a class="xsd-link" href="api/webservices/download?file=' + encodeURIComponent(svc.xsdRequest) + '"><i class="fa fa-download"></i> Request XSD</a>';
            }
            if (svc.xsdSchema) {
                html += '<a class="xsd-link" href="api/webservices/download?file=' + encodeURIComponent(svc.xsdSchema) + '"><i class="fa fa-download"></i> Response XSD</a>';
            }
            return html + '</div>';
        }

        function loadAllSchemas(data) {
            $(data.serviceCategory).each(function(i, cat) {
                $(cat.services).each(function(j, svc) {
                    /* Carry the resolved endpoint URL into each cached service reference */
                    var svcResolved = $.extend({}, svc, { link: swapEndpoint(svc.link) });
                    if (svc.xsdRequest) loadXsdSchema(svc.xsdRequest, svc.href, 'req', svcResolved);
                    if (svc.xsdSchema)  loadXsdSchema(svc.xsdSchema,  svc.href, 'res', svcResolved);
                });
            });
        }

        function loadXsdSchema(filename, href, type, svc) {
            $.ajax({
                url: 'api/webservices/xsd?file=' + encodeURIComponent(filename),
                type: 'GET',
                success: function(data) {
                    schemaCache[href] = schemaCache[href] || {};
                    schemaCache[href].svc = svc;
                    if (type === 'req') {
                        schemaCache[href].request = data;
                        renderForm(href, data, svc);
                        renderSchemaTable('schema-req-' + href, data);
                    } else {
                        schemaCache[href].response = data;
                        renderSchemaTable('schema-res-' + href, data);
                    }
                },
                error: function() {
                    if (type === 'req') {
                        $('#form-container-' + href).html('<em>Schema not available.</em>');
                        $('#schema-req-' + href).html('<em>Schema not available.</em>');
                    } else {
                        $('#schema-res-' + href).html('<em>Schema not available.</em>');
                    }
                }
            });
        }

        function renderSchemaTable(containerId, data) {
            if (!data || !data.Request) {
                $('#' + containerId).html('<em>Schema not available.</em>');
                return;
            }
            var request = data.Request;
            var rootName = request.Name;
            var allChildObjects = request.ChildObjects || {};
            var fields = allChildObjects[rootName] || [];
            if (fields.length === 0) {
                $('#' + containerId).html('<em>No parameters defined.</em>');
                return;
            }

            var totalRows = countSchemaRows(fields, allChildObjects);
            var reqCount = 0;
            $.each(fields, function(i, f) { if (f.Required) reqCount++; });
            var summary = totalRows + ' field' + (totalRows !== 1 ? 's' : '') +
                (reqCount > 0 ? ' &nbsp;&bull;&nbsp; ' + reqCount + ' required' : '');

            var tableHtml = '<div class="schema-table-wrap"><table class="schema-table">' +
                '<thead><tr><th>Parameter</th><th>Type</th><th>Required</th><th>Constraints &amp; Notes</th></tr></thead>' +
                '<tbody>';
            $.each(fields, function(i, field) {
                tableHtml += renderSchemaRow(field, allChildObjects, 0);
            });
            tableHtml += '</tbody></table></div>';

            var html =
                '<div class="schema-accordion">' +
                '<button type="button" class="schema-toggle-btn" onclick="toggleSchemaAccordion(this)">' +
                '<span class="schema-toggle-left">' +
                '<i class="fa fa-table"></i>' +
                '<span>' + rootName + '</span>' +
                '<span class="schema-toggle-count">(' + summary + ')</span>' +
                '</span>' +
                '<i class="fa fa-chevron-down schema-chevron"></i>' +
                '</button>' +
                '<div class="schema-body">' + tableHtml + '</div>' +
                '</div>';

            $('#' + containerId).html(html);
        }

        function toggleSchemaAccordion(btn) {
            var $btn = $(btn);
            var $body = $btn.next('.schema-body');
            if ($btn.hasClass('is-open')) {
                $body.slideUp(180);
                $btn.removeClass('is-open');
            } else {
                $body.slideDown(220);
                $btn.addClass('is-open');
            }
        }

        function countSchemaRows(fields, allChildObjects) {
            var count = 0;
            $.each(fields, function(i, field) {
                count++;
                if (field.IsComplex) {
                    var lookupType = field.Type ? field.Type.replace(' [ ]', '').trim() : null;
                    var sub = lookupType && allChildObjects[lookupType] ? allChildObjects[lookupType] : null;
                    if (!sub && field.ChildObjects) sub = field.ChildObjects;
                    if (sub) count += sub.length;
                }
            });
            return count;
        }

        function renderSchemaRow(field, allChildObjects, depth) {
            var indentPx = depth * 22 + 10;
            var reqBadge = field.Required
                ? '<span class="badge-req">required</span>'
                : '<span class="badge-opt">optional</span>';
            var typeBadge = buildTypeBadge(field);
            var constraints = buildConstraints(field);
            var prefix = depth > 0 ? '<span class="tree-arrow">&#8627;</span> ' : '';
            var attrTag = field.IsAttribute ? ' <span class="badge-attr">attr</span>' : '';
            var html = '<tr>' +
                '<td style="padding-left:' + indentPx + 'px">' + prefix + '<span class="param-name">' + escapeXml(field.Name) + '</span>' + attrTag + '</td>' +
                '<td>' + typeBadge + '</td>' +
                '<td>' + reqBadge + '</td>' +
                '<td class="constraints-cell">' + constraints + '</td>' +
                '</tr>';
            if (field.IsComplex) {
                var lookupType = field.Type ? field.Type.replace(' [ ]', '').trim() : null;
                var subFields = lookupType && allChildObjects[lookupType] ? allChildObjects[lookupType] : null;
                if (!subFields && field.ChildObjects && field.ChildObjects.length > 0) {
                    subFields = field.ChildObjects;
                }
                if (subFields) {
                    $.each(subFields, function(j, sf) {
                        html += renderSchemaRow(sf, allChildObjects, depth + 1);
                    });
                }
            }
            return html;
        }

        function buildTypeBadge(field) {
            var rawType = field.Type || 'string';
            if (field.SimpleElement && field.SimpleElement.EnumType) rawType = 'enum';
            var isArray = rawType.indexOf(' [ ]') >= 0;
            var type = rawType.replace(' [ ]', '').replace(/^xs:/, '').toLowerCase();
            var cls = 'type-other';
            if (type === 'string') cls = 'type-string';
            else if (type === 'date' || type === 'datetime') cls = 'type-date';
            else if (type === 'boolean') cls = 'type-boolean';
            else if (type === 'integer' || type === 'int' || type === 'decimal' || type === 'float' ||
                     type === 'double' || type === 'nonnegativeinteger' || type === 'positiveinteger') cls = 'type-number';
            else if (type === 'enum') cls = 'type-enum';
            return '<span class="type-badge ' + cls + '">' + escapeXml(type) + '</span>' +
                   (isArray ? ' <span class="array-mark">[ ]</span>' : '');
        }

        function buildConstraints(field) {
            var parts = [];
            /* xs:annotation/xs:documentation → Comment; xmlns:doc attribute → Description; fallback to dictionary */
            var desc = field.Comment || field.Description || FIELD_DESC[field.Name] || '';
            if (desc) parts.push('<span class="constraint-comment">' + escapeXml(desc) + '</span>');
            if (field.Value) parts.push('Default: <code class="val-code">' + escapeXml(field.Value) + '</code>');
            if (field.SimpleElement) {
                var se = field.SimpleElement;
                if (se.EnumType && se.EnumType.Enums && se.EnumType.Enums.length > 0) {
                    var enumHtml = $.map(se.EnumType.Enums, function(e) {
                        return '<code class="enum-code">' + escapeXml(e) + '</code>';
                    }).join(' ');
                    parts.push('Values: ' + enumHtml);
                }
                if (se.MinMaxType) {
                    parts.push('Range: <code class="val-code">' + escapeXml(se.MinMaxType.MinValue) + '</code> &ndash; <code class="val-code">' + escapeXml(se.MinMaxType.MaxValue) + '</code>');
                }
                if (se.PatternType) {
                    parts.push('Pattern: <code class="val-code">' + escapeXml(se.PatternType.Pattern) + '</code>');
                }
            }
            return parts.length ? parts.join('<br>') : '<span class="no-constraint">—</span>';
        }

        function renderForm(href, data, svc) {
            if (!data || !data.Request) {
                $('#form-container-' + href).html('<em>Schema not available.</em>');
                return;
            }
            var request = data.Request;
            var rootName = request.Name;
            var allChildObjects = request.ChildObjects || {};
            var fields = allChildObjects[rootName];
            if (!fields || fields.length === 0) {
                $('#form-container-' + href).html('<em>No fields found.</em>');
                return;
            }

            /* Split: optional boolean flags go into a collapsible 3-col group */
            var mainFields = [];
            var optBoolFields = [];
            fields.forEach(function(f) {
                var type = (f.Type || '').toLowerCase().replace(/^xs:/, '');
                if (!f.Required && !f.IsComplex && type === 'boolean') {
                    optBoolFields.push(f);
                } else {
                    mainFields.push(f);
                }
            });

            var html = '';
            var i = 0;
            while (i < mainFields.length) {
                var field = mainFields[i];
                if (field.IsComplex) {
                    html += '<div class="field-row">' + renderComplexField(field, href, allChildObjects) + '</div>';
                    i++;
                } else {
                    var rowHtml = '<div class="field-row">' + renderSimpleField(field, href);
                    i++;
                    if (i < mainFields.length && !mainFields[i].IsComplex) {
                        rowHtml += renderSimpleField(mainFields[i], href);
                        i++;
                    }
                    html += rowHtml + '</div>';
                }
            }

            /* Optional boolean flags collapsible block */
            if (optBoolFields.length > 0) {
                var boolHtml = '';
                optBoolFields.forEach(function(f) { boolHtml += renderSimpleField(f, href); });
                html += '<div class="field-row" style="width:100%;display:block;padding:0 8px">' +
                    '<button type="button" class="optional-group-toggle" onclick="var b=this.nextElementSibling;b.classList.toggle(\'is-open\');this.classList.toggle(\'is-open\')">' +
                    '<i class="fa fa-caret-right"></i> Optional Flags</button>' +
                    '<div class="optional-group-body"><div class="bool-flags-grid">' + boolHtml + '</div></div>' +
                    '</div>';
            }

            html += '<div class="generate-row"><button type="button" class="btn btn-primary btn-generate" onclick="generateAndSend(\'' + href + '\')">Generate &amp; Send</button></div>';
            $('#form-container-' + href).html(html);
        }

        function renderSimpleField(field, href) {
            var fid = 'f-' + href + '-' + safeId(field.Name);
            var label = field.Name + (field.Required ? ' *' : '') + ':';
            var lookupBtn = FIELD_LOOKUPS[field.Name]
                ? ' <button type="button" class="btn-lookup" onclick="openLookupModal(\'' + escapeAttr(fid) + '\',\'' + escapeAttr(field.Name) + '\')" title="Browse available values"><i class="fa fa-search"></i></button>'
                : '';
            return '<div class="field-cell">' +
                '<label for="' + fid + '">' + label + lookupBtn + '</label>' +
                buildInput(field, fid) +
                '</div>';
        }

        function renderComplexField(field, href, allChildObjects) {
            var subFields = null;
            var childElemName = null;
            var isAttrBased = false;

            var lookupType = field.Type ? field.Type.replace(' [ ]', '').trim() : null;
            if (lookupType && allChildObjects[lookupType]) {
                subFields = allChildObjects[lookupType];
                isAttrBased = subFields.length > 0 && subFields[0].IsAttribute;
            }

            if (field.ChildObjects && field.ChildObjects.length > 0) {
                childElemName = field.ChildObjects[0].Name;
            }

            var label = field.Name + (field.Required ? ' *' : '') + ':';
            var innerHtml = '';

            if (subFields && subFields.length > 0) {
                var j = 0;
                while (j < subFields.length) {
                    var sf = subFields[j];
                    var sfId = 'f-' + href + '-' + safeId(field.Name) + '-' + safeId(sf.Name);
                    var sfLabel = sf.Name + (sf.Required ? ' *' : '') + ':';
                    var sfLookupBtn = FIELD_LOOKUPS[sf.Name]
                        ? ' <button type="button" class="btn-lookup" onclick="openLookupModal(\'' + escapeAttr(sfId) + '\',\'' + escapeAttr(sf.Name) + '\')" title="Browse available values"><i class="fa fa-search"></i></button>'
                        : '';
                    innerHtml += '<div class="field-row"><div class="field-cell"><label for="' + sfId + '">' + sfLabel + sfLookupBtn + '</label>' + buildInput(sf, sfId) + '</div>';
                    j++;
                    if (j < subFields.length) {
                        var sf2 = subFields[j];
                        var sf2Id = 'f-' + href + '-' + safeId(field.Name) + '-' + safeId(sf2.Name);
                        var sf2Label = sf2.Name + (sf2.Required ? ' *' : '') + ':';
                        var sf2LookupBtn = FIELD_LOOKUPS[sf2.Name]
                            ? ' <button type="button" class="btn-lookup" onclick="openLookupModal(\'' + escapeAttr(sf2Id) + '\',\'' + escapeAttr(sf2.Name) + '\')" title="Browse available values"><i class="fa fa-search"></i></button>'
                            : '';
                        innerHtml += '<div class="field-cell"><label for="' + sf2Id + '">' + sf2Label + sf2LookupBtn + '</label>' + buildInput(sf2, sf2Id) + '</div>';
                        j++;
                    }
                    innerHtml += '</div>';
                }
            }

            return '<div style="width:100%;padding:0 8px">' +
                '<fieldset class="complex-fieldset">' +
                '<legend>' + label + '</legend>' +
                innerHtml +
                '</fieldset></div>';
        }

        function buildInput(field, fid) {
            var rawType = field.Type || '';
            var type = rawType.toLowerCase().replace(/^xs:/, '');
            var val = field.Value || '';

            /* Auto-fill credentials from session */
            if (field.Name === 'Username' && CL_SESSION.username) val = CL_SESSION.username;
            if (field.Name === 'Password') {
                var passVal = CL_SESSION.password || val;
                return '<input type="password" class="form-control" id="' + fid + '" value="' + escapeAttr(passVal) + '" autocomplete="current-password" />';
            }

            if (field.SimpleElement) {
                var se = field.SimpleElement;
                if (se.EnumType && se.EnumType.Enums && se.EnumType.Enums.length > 0) {
                    var opts = '<option value="">Select One</option>';
                    $.each(se.EnumType.Enums, function(k, e) {
                        opts += '<option value="' + escapeAttr(e) + '"' + (e === val ? ' selected' : '') + '>' + e + '</option>';
                    });
                    return '<select class="form-control" id="' + fid + '">' + opts + '</select>';
                }
                if (se.MinMaxType) {
                    return '<input type="number" class="form-control" id="' + fid + '" value="' + escapeAttr(val) + '"' +
                        ' min="' + escapeAttr(se.MinMaxType.MinValue) + '" max="' + escapeAttr(se.MinMaxType.MaxValue) + '" />';
                }
                if (se.PatternType) {
                    return '<input type="text" class="form-control" id="' + fid + '" value="' + escapeAttr(val) + '" placeholder="' + escapeAttr(se.PatternType.Pattern) + '" />';
                }
            }

            if (type === 'date') {
                return '<input type="date" class="form-control" id="' + fid + '" value="' + escapeAttr(val) + '" />';
            }
            if (type === 'integer' || type === 'int' || type === 'decimal' || type === 'float' ||
                    type === 'double' || type === 'nonnegativeinteger' || type === 'positiveinteger') {
                return '<input type="number" class="form-control" id="' + fid + '" value="' + escapeAttr(val) + '" />';
            }
            if (type === 'boolean') {
                return '<select class="form-control" id="' + fid + '">' +
                    '<option value="">Select One</option>' +
                    '<option value="true"' + (val === 'true' ? ' selected' : '') + '>true</option>' +
                    '<option value="false"' + (val === 'false' ? ' selected' : '') + '>false</option>' +
                    '</select>';
            }

            return '<input type="text" class="form-control" id="' + fid + '" value="' + escapeAttr(val) + '" />';
        }

        function generateAndSend(href) {
            var cache = schemaCache[href];
            if (!cache || !cache.request) return;

            var xml = generateXml(href, cache.request);
            $('#xml-req-code-' + href).text(xml);

            var link = cache.svc ? cache.svc.link : null;
            if (!link) return;

            $('#xml-res-code-' + href).text('Sending request...');
            $.ajax({
                url: 'api/webservices/proxy',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ Url: link, Xml: xml }),
                success: function(response) {
                    $('#xml-res-code-' + href).text(typeof response === 'string' ? response : JSON.stringify(response, null, 2));
                },
                error: function(xhr) {
                    $('#xml-res-code-' + href).text('Error: ' + (xhr.responseText || xhr.statusText));
                }
            });
        }

        function generateXml(href, data) {
            var request = data.Request;
            var rootName = request.Name;
            var allChildObjects = request.ChildObjects || {};
            var fields = allChildObjects[rootName] || [];

            var lines = [];
            lines.push('<' + rootName + ' xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">');

            $.each(fields, function(i, field) {
                if (field.IsComplex) {
                    var complexLines = buildComplexXmlLines(field, href, allChildObjects);
                    if (complexLines.length > 0) {
                        $.each(complexLines, function(j, l) { lines.push('  ' + l); });
                    }
                } else {
                    var fid = 'f-' + href + '-' + safeId(field.Name);
                    var val = $('#' + fid).val() || '';
                    if (val !== '') {
                        lines.push('  <' + field.Name + '>' + escapeXml(val) + '</' + field.Name + '>');
                    }
                }
            });

            lines.push('</' + rootName + '>');
            return lines.join('\n');
        }

        function buildComplexXmlLines(field, href, allChildObjects) {
            var lines = [];
            var subFields = null;
            var childElemName = null;
            var isAttrBased = false;

            var lookupType = field.Type ? field.Type.replace(' [ ]', '').trim() : null;
            if (lookupType && allChildObjects[lookupType]) {
                subFields = allChildObjects[lookupType];
                isAttrBased = subFields.length > 0 && subFields[0].IsAttribute;
            }

            // Always resolve child element name from ChildObjects regardless of type lookup
            if (field.ChildObjects && field.ChildObjects.length > 0) {
                childElemName = field.ChildObjects[0].Name;
            }

            var innerLines = [];

            if (subFields && subFields.length > 0) {
                if (isAttrBased) {
                    var attrStr = '';
                    $.each(subFields, function(j, attr) {
                        var aid = 'f-' + href + '-' + safeId(field.Name) + '-' + safeId(attr.Name);
                        var aval = $('#' + aid).val() || '';
                        if (aval !== '') {
                            attrStr += ' ' + attr.Name + '="' + escapeAttr(aval) + '"';
                        }
                    });
                    if (childElemName) {
                        // Attrs on a wrapper child element: <Rooms><Room Adults="2" .../></Rooms>
                        if (field.Required || attrStr !== '') {
                            innerLines.push('  <' + childElemName + attrStr + ' />');
                        }
                    } else {
                        // Attrs directly on this element: <ArrivalDate From="..." To="..."/>
                        if (field.Required || attrStr !== '') {
                            lines.push('<' + field.Name + attrStr + ' />');
                        }
                        return lines;
                    }
                } else {
                    $.each(subFields, function(j, sf) {
                        var sfid = 'f-' + href + '-' + safeId(field.Name) + '-' + safeId(sf.Name);
                        var sfval = $('#' + sfid).val() || '';
                        if (sfval !== '') {
                            innerLines.push('  <' + sf.Name + '>' + escapeXml(sfval) + '</' + sf.Name + '>');
                        }
                    });
                }
            }

            // When required and still empty, emit a minimal child element (e.g. <Room />)
            if (innerLines.length === 0 && field.Required && childElemName) {
                innerLines.push('  <' + childElemName + ' />');
            }

            if (innerLines.length > 0 || field.Required) {
                lines.push('<' + field.Name + '>');
                $.each(innerLines, function(k, l) { lines.push(l); });
                lines.push('</' + field.Name + '>');
            }

            return lines;
        }

        function safeId(name) {
            return name.replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function escapeXml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function escapeAttr(str) {
            return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        var _lookupFid = null;
        var _lookupFieldName = null;

        function openLookupModal(fid, fieldName) {
            var cfg = FIELD_LOOKUPS[fieldName];
            if (!cfg) return;
            _lookupFid = fid;
            _lookupFieldName = fieldName;

            document.getElementById('lookup-modal-title').textContent = cfg.title;
            document.getElementById('lookup-loading').style.display = 'none';
            document.getElementById('lookup-error').style.display = 'none';
            document.getElementById('lookup-table').style.display = 'none';
            document.getElementById('lookup-tbody').innerHTML = '';

            var extrasDiv = document.getElementById('lookup-modal-extras');
            if (cfg.requiresInput) {
                extrasDiv.style.display = '';
                extrasDiv.innerHTML = '<div class="lookup-extra-row">' +
                    '<label>' + escapeAttr(cfg.requiresInput.label) + ':</label>' +
                    '<input type="' + cfg.requiresInput.type + '" id="lookup-extra-input" placeholder="Enter ' + escapeAttr(cfg.requiresInput.label) + '" />' +
                    '<button class="btn-lookup-load" onclick="execLookup()"><i class="fa fa-search"></i> Load</button>' +
                    '</div>';
            } else {
                extrasDiv.style.display = 'none';
                extrasDiv.innerHTML = '';
            }

            document.getElementById('lookup-overlay').classList.add('is-open');
            if (!cfg.requiresInput) execLookup();
        }

        function closeLookupModal() {
            document.getElementById('lookup-overlay').classList.remove('is-open');
            _lookupFid = null;
            _lookupFieldName = null;
        }

        function execLookup() {
            var cfg = FIELD_LOOKUPS[_lookupFieldName];
            if (!cfg) return;

            var u = CL_SESSION.username || '';
            var p = CL_SESSION.password || '';
            var extra = {};
            if (cfg.requiresInput) {
                extra[cfg.requiresInput.name] = (document.getElementById('lookup-extra-input') || {}).value || '';
                if (!extra[cfg.requiresInput.name]) {
                    document.getElementById('lookup-error').textContent = cfg.requiresInput.label + ' is required.';
                    document.getElementById('lookup-error').style.display = '';
                    return;
                }
            }

            var rawUrl = svcLinkByHref[cfg.sourceHref];
            if (!rawUrl) {
                document.getElementById('lookup-error').textContent = 'Source service not found: ' + cfg.sourceHref;
                document.getElementById('lookup-error').style.display = '';
                return;
            }
            var url = swapEndpoint(rawUrl);
            var xml = cfg.buildXml(u, p, extra);

            document.getElementById('lookup-loading').style.display = '';
            document.getElementById('lookup-error').style.display = 'none';
            document.getElementById('lookup-table').style.display = 'none';

            $.ajax({
                url: 'api/webservices/proxy',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ Url: url, Xml: xml }),
                success: function(response) {
                    document.getElementById('lookup-loading').style.display = 'none';
                    var xmlText = typeof response === 'string' ? response : JSON.stringify(response);
                    var parser = new DOMParser();
                    var xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                    if (xmlDoc.getElementsByTagName('parseerror').length > 0) {
                        document.getElementById('lookup-error').textContent = 'Could not parse response XML.';
                        document.getElementById('lookup-error').style.display = '';
                        return;
                    }
                    var rows = cfg.parseRows(xmlDoc);
                    if (!rows.length) {
                        document.getElementById('lookup-error').textContent = 'No results returned from the service.';
                        document.getElementById('lookup-error').style.display = '';
                        return;
                    }
                    var tbody = document.getElementById('lookup-tbody');
                    tbody.innerHTML = rows.map(function(r) {
                        var id = escapeAttr(String(r.id || ''));
                        var lbl = escapeAttr(String(r.label || ''));
                        return '<tr><td style="font-family:monospace;font-weight:600;color:#1C4084">' + id + '</td>' +
                            '<td>' + lbl + '</td>' +
                            '<td><button class="btn-lookup-use" onclick="useLookupValue(\'' + id + '\')">Use</button></td></tr>';
                    }).join('');
                    document.getElementById('lookup-table').style.display = '';
                },
                error: function(xhr) {
                    document.getElementById('lookup-loading').style.display = 'none';
                    document.getElementById('lookup-error').textContent = 'Request failed: ' + (xhr.responseText || xhr.statusText || 'Unknown error').substring(0, 120);
                    document.getElementById('lookup-error').style.display = '';
                }
            });
        }

        function useLookupValue(id) {
            if (_lookupFid) $('#' + _lookupFid).val(id);
            closeLookupModal();
        }
